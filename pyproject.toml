[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "djmix"
version = "0.1.0"
description = "DJ mix generator: measured DSP analysis, validated planning, deterministic rendering."
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.11,<0.12",
    "numpy>=1.26,<2.6",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pedalboard>=0.9",
    "pyloudnorm>=0.1.1",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2",
    "pyyaml>=6",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
llm = ["groq>=0.11", "anthropic>=0.34"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
djmix = "djmix.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"djmix.web" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: end-to-end tests that render audio"]
